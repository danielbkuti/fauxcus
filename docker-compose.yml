services:

  db:
    image: postgres:16
    container_name: flexmaster_db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - flexmaster_network


  web:
    build: .
    container_name: flexmaster_web
    restart: unless-stopped

    command: python backend/manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8637:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    networks:
      - flexmaster_network


  # Broker for Celery (backend/flexmaster/celery.py) — hands the daily
  # deadline-digest job from celery_beat (below) to celery_worker.
  # Local-dev-only, same as both of those: no persistent process runs
  # in production at all (see render.yaml's own comments on why).
  redis:
    image: redis:7-alpine
    container_name: flexmaster_redis
    restart: unless-stopped

    networks:
      - flexmaster_network

  # Executes jobs Celery Beat schedules (currently just
  # tasks.tasks.send_deadline_digest_task). Same image/env as `web`,
  # just a different command, so it needs no separate Dockerfile.
  celery_worker:
    build: .
    container_name: flexmaster_celery_worker
    restart: unless-stopped

    command: sh -c "cd backend && celery -A flexmaster worker --loglevel=info"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - flexmaster_network

  # Replaces backend/scheduler.py's old sleep-until-target-time loop —
  # ticks on a schedule (flexmaster.settings.CELERY_BEAT_SCHEDULE) and
  # hands due jobs to celery_worker via redis, rather than sleeping and
  # running a job directly itself.
  celery_beat:
    build: .
    container_name: flexmaster_celery_beat
    restart: unless-stopped

    command: sh -c "cd backend && celery -A flexmaster beat --loglevel=info"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - flexmaster_network


volumes:
  postgres_data:


networks:
  flexmaster_network: