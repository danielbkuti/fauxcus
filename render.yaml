# Render Blueprint — provisions the one service this needs to be
# viewable for $0/month from one "New Blueprint" in the Render
# dashboard, pointed at this repo.
# https://render.com/docs/blueprint-spec
#
# One service, not two: frontend and backend used to be a separate
# Render static site and web service, but that put them on two
# different *.onrender.com subdomains — and *.onrender.com subdomains
# are treated as separate sites from each other for cookie purposes
# (same reason *.vercel.app/*.github.io work this way: a hosting
# platform's own domain has to, for its customers' security). Every
# request from the frontend to the API was a third-party-cookie
# situation, and browsers increasingly block those by default —
# confirmed live: the API's Set-Cookie was correctly formed
# (SameSite=None; Secure) and worked fine visiting fauxcus-api
# directly, but document.cookie came back completely empty after the
# same request made cross-subdomain from fauxcus-frontend. No amount
# of cookie-attribute tuning fixes that; it's architectural.
#
# Fixed by folding the frontend into this same service instead:
# Dockerfile.render builds it in a Node stage and WhiteNoise serves
# the result directly out of this Django process (see
# WHITENOISE_ROOT in settings.py, and pages.views.spa_view for the
# React-Router-refresh fallback) — same origin, so it's just a plain
# same-site cookie now, and VITE_API_BASE_URL/FRONTEND_URL cross-service
# URL wiring isn't needed at all anymore (FRONTEND_URL self-derives
# from RENDER_EXTERNAL_HOSTNAME).
#
# What's still deliberately NOT in here, and why:
#   - A Render-managed Postgres database. Render's free Postgres
#     expires 30 days after creation (14-day grace period, then it's
#     deleted with all its data) — not actually free for anything you
#     want to keep working. Use Neon (neon.tech) instead: free forever,
#     no card, no expiration. Sign up, create a project, and paste its
#     connection string into DATABASE_URL below by hand (`sync: false`
#     — Render prompts for it rather than deploying with it blank) —
#     settings.py already accepts DATABASE_URL directly via
#     dj-database-url, so this needs zero code changes.
#   - A scheduler for the daily deadline-digest email, as a *Render*
#     service. Render has no free tier for either a Worker (bills 24/7
#     regardless of plan) or a Cron Job ($1/month minimum), so it isn't
#     defined here as a `type: cron` service. The digest still runs
#     daily in production, though — for $0 — via a GitHub Actions
#     `schedule:` workflow (.github/workflows/deadline-digest-cron.yml)
#     that POSTs to the DIGEST_CRON_TOKEN-protected
#     /api/internal/send-deadline-digest/ endpoint below once a day.
#     Local dev runs the same job on its own schedule instead, via
#     Celery + Redis (backend/flexmaster/celery.py, docker-compose.yml's
#     celery_worker/celery_beat/redis services) — neither of those runs
#     in production either, same reasoning as above. If a Render-native
#     cron is ever preferred over the GitHub Actions workflow, add
#     it as a `type: cron` service (schedule: "0 13 * * *",
#     dockerCommand: python backend/manage.py send_deadline_digest,
#     same dockerfilePath/dockerContext as below) and drop the GitHub
#     Actions workflow.
#
# Migrations run automatically instead of needing a manual step: Shell
# access and the "Pre-Deploy Command" feature are both paid-only on
# Render, so `migrate` is chained straight into this service's own
# start command below rather than something you'd run separately. It's
# safe to run on every boot (including every cold-start wake from the
# free plan's 15-minute idle spin-down, not just real deploys) —
# Django's migration runner is a no-op once everything's already
# applied.

services:
  - type: web
    name: fauxcus-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    # migrate, then gunicorn — see render-start.sh and the note above.
    # Not an inline `sh -c "... && ..."` string here — that exited 127
    # ("command not found"): dockerCommand doesn't appear to go through
    # a real shell parse, so the embedded quotes broke instead of
    # being consumed as quoting syntax.
    dockerCommand: sh render-start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost
      # Neon's connection string — see the note at the top.
      - key: DATABASE_URL
        sync: false
      # Optional, comma-separated — a custom domain, most likely, if
      # you ever add one. Not needed for the plain onrender.com URL:
      # FRONTEND_URL self-derives from RENDER_EXTERNAL_HOSTNAME now
      # that frontend and backend are the same service.
      - key: ADDITIONAL_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Shared secret for /api/internal/send-deadline-digest/ — must
      # match the DIGEST_CRON_TOKEN secret on the GitHub Actions
      # workflow that calls it daily (see the note above and
      # .github/workflows/deadline-digest-cron.yml). sync: false so
      # Render prompts for it rather than deploying with it blank.
      - key: DIGEST_CRON_TOKEN
        sync: false
      # Error monitoring — free tier (5k events/month), get a DSN from
      # sentry.io. sync: false so Render prompts for it; left blank
      # here just disables Sentry entirely rather than breaking
      # anything (see settings.py's SENTRY_DSN handling).
      - key: SENTRY_DSN
        sync: false
      # Populates demo@example.com with a realistic task history the
      # first time this runs against a database where that account has
      # no tasks yet (a fresh Neon DB, or the demo account's tasks
      # having just been cleared to reseed with corrected data) — see
      # render-start.sh and seed_demo_data.py. Idempotent (no-ops once
      # the account has any tasks), so left on permanently rather than
      # flipped back off after the first successful run.
      - key: SEED_DEMO_DATA
        value: "true"
