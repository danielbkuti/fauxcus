# Render Blueprint — provisions the two services this needs to be
# viewable for $0/month from one "New Blueprint" in the Render
# dashboard, pointed at this repo.
# https://render.com/docs/blueprint-spec
#
# What's deliberately NOT in here, and why:
#   - A Render-managed Postgres database. Render's free Postgres
#     expires 30 days after creation (14-day grace period, then it's
#     deleted with all its data) — not actually free for anything you
#     want to keep working. Use Neon (neon.tech) instead: free forever,
#     no card, no expiration. Sign up, create a project, and paste its
#     connection string into fauxcus-api's DATABASE_URL below by hand
#     (`sync: false` — Render prompts for it rather than deploying with
#     it blank) — settings.py already accepts DATABASE_URL directly
#     via dj-database-url, so this needs zero code changes.
#   - The scheduler (backend/scheduler.py's daily deadline-digest
#     email). Render has no free tier for either a Worker (bills 24/7
#     regardless of plan) or a Cron Job ($1/month minimum) — dropped
#     here so the whole deployment stays genuinely free. Add it back
#     later as a `type: cron` service (schedule: "0 13 * * *",
#     dockerCommand: python backend/manage.py send_deadline_digest)
#     whenever the daily reminder email is worth a dollar a month to
#     you; nothing else in this file needs to change to add it.
#   - A same-file reference to another service's full https:// URL —
#     fromService only exposes bare host/port, not a scheme. So
#     FRONTEND_URL, ADDITIONAL_TRUSTED_ORIGINS and VITE_API_BASE_URL
#     below are `sync: false` too — fill them in with the real
#     onrender.com URLs Render assigns after the first deploy, then
#     redeploy fauxcus-api and fauxcus-frontend once more.
#
# Migrations run automatically instead of needing a manual step: Shell
# access and the "Pre-Deploy Command" feature are both paid-only on
# Render, so `migrate` is chained straight into fauxcus-api's own start
# command below rather than something you'd run separately. It's safe
# to run on every boot (including every cold-start wake from the free
# plan's 15-minute idle spin-down, not just real deploys) — Django's
# migration runner is a no-op once everything's already applied.

services:
  - type: web
    name: fauxcus-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Same image docker-compose already builds for `web`, just started
    # via render-start.sh (migrate, then gunicorn — see that file and
    # the note above) instead of Django's own dev-only runserver. Not
    # an inline `sh -c "... && ..."` string here — that exited 127
    # ("command not found"): dockerCommand doesn't appear to go through
    # a real shell parse, so the embedded quotes broke instead of
    # being consumed as quoting syntax.
    dockerCommand: sh render-start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost
      # Neon's connection string — see the note at the top.
      - key: DATABASE_URL
        sync: false
      # Fill in after the first deploy — see the note at the top.
      - key: FRONTEND_URL
        sync: false
      - key: ADDITIONAL_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Set to "true" for one deploy to populate demo@example.com with
      # a realistic task history on a fresh database — see
      # render-start.sh and seed_demo_data.py. Idempotent, so it's
      # fine to leave set afterward.
      - key: SEED_DEMO_DATA
        value: "false"

  - type: web
    name: fauxcus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Fill in with fauxcus-api's real URL after its first deploy.
      - key: VITE_API_BASE_URL
        sync: false
    # React Router routes are client-side — without this, a hard
    # refresh on e.g. /tasks/5 404s instead of loading index.html and
    # letting the router take over.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
